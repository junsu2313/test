# User-facing camera control UI.
# Include this fragment in the Opal web server configuration.
location = /cc {
    return 302 /remote-ui/0716-1.1.html;
}

# Opal currently has a legacy /www/cc directory, so nginx normalizes /cc
# to /cc/ before serving it. Cover both forms to avoid the legacy UI.
location = /cc/ {
    return 302 /remote-ui/0716-1.1.html;
}
